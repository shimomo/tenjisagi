name: Update

on:
  schedule:
    - cron: '3 */3 * * *'
  workflow_dispatch:
    inputs:
      lookback_days:
        description: 'Re-analyze days before yesterday that have no racers, going back this many days'
        required: false
        default: '14'

permissions:
  contents: write

env:
  TARGET_BRANCH: gh-pages

jobs:
  update:
    name: Update on PHP ${{ matrix.php-version }} (Ubuntu 24.04)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php-version:
          - '8.5'
    steps:
      - name: Setup PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: mbstring, xml

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Determine target dates (JST)
        id: date
        run: |
          echo "today=$(TZ=Asia/Tokyo date +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
          echo "yesterday=$(TZ=Asia/Tokyo date -d 'yesterday' +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
          echo "day_before_yesterday=$(TZ=Asia/Tokyo date -d '2 days ago' +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Re-analyze earlier days that have no racers yet
        env:
          LOOKBACK_DAYS: ${{ inputs.lookback_days || '14' }}
        run: |
          set -o pipefail
          php bin/find-dates-without-racers.php "${LOOKBACK_DAYS}" "${{ steps.date.outputs.day_before_yesterday }}" |
            while read -r date; do
              php bin/analyze-course-changes.php "${date}"
            done

      - name: Analyze yesterday's course changes
        run: php bin/analyze-course-changes.php "${{ steps.date.outputs.yesterday }}"

      - name: Analyze today's course changes
        run: php bin/analyze-course-changes.php "${{ steps.date.outputs.today }}"

      - name: Aggregate course changes summary
        run: php bin/aggregate-course-changes.php

      - name: Commit and push changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/course-changes docs/course-changes-summary.json
          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "chore: update course changes data for ${{ steps.date.outputs.yesterday }} and ${{ steps.date.outputs.today }}"
            git push origin HEAD:"${TARGET_BRANCH}" || (git pull --rebase origin "${TARGET_BRANCH}" && git push origin HEAD:"${TARGET_BRANCH}")
          fi
