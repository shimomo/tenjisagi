name: Audit

on:
  push:
    branches:
      - gh-pages
  pull_request:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  audit:
    name: Audit composer.lock (Ubuntu 24.04)
    runs-on: ubuntu-24.04
    steps:
      - name: Setup PHP 8.5
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'

      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Audit Composer
        run: composer audit --locked
